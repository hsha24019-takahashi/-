<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モノ申すおみくじ V3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header>
        <h1>モノ申すおみくじ</h1>
        <p>〜我が家の日用品シアター〜</p>
    </header>

    <div class="content-area">
        <div id="screenTop" class="screen-top">
            <div id="omikujiVisual" class="omikuji-visual">📦</div>
            <div>
                <button id="btnDraw" class="btn-draw" onclick="drawOmikuji()">物たちの噂話を聞く</button>
                <div id="limitNotice" class="limit-notice">本日の覗き見は終了しました。また明日（午前4時以降）お越しください。</div>
            </div>
        </div>

        <div id="screenResult" class="screen-result">
            <div class="fortune-header">
                <div id="fortuneRank" class="fortune-rank">ーー</div>
                <div id="fortuneSub" class="fortune-sub">ーーー</div>
            </div>

            <div class="theater-stage">
                <div id="char-clock" class="character">
                    <div id="effect-clock" class="effect-layer"></div>
                    <div class="char-avatar">⏰<div id="face-clock" class="char-face-overlay"></div></div>
                    <div class="char-name">時計</div>
                </div>
                <div id="char-mirror" class="character">
                    <div id="effect-mirror" class="effect-layer"></div>
                    <div class="char-avatar">🪞<div id="face-mirror" class="char-face-overlay"></div></div>
                    <div class="char-name">姿見</div>
                </div>
                <div id="char-third" class="character">
                    <div id="effect-third" class="effect-layer"></div>
                    <div id="avatar-third" class="char-avatar">🔌<div id="face-third" class="char-face-overlay"></div></div>
                    <div id="name-third" class="char-name">充電器</div>
                </div>
            </div>

            <div class="dialogue-box" onclick="nextDialogue()">
                <div id="dialogueSpeaker" class="dialogue-speaker">ーー</div>
                <div id="dialogueText" class="dialogue-text">ーーー</div>
                <div id="dialogueHint" class="dialogue-hint">タップで進む ▶</div>
            </div>

            <div id="resultActions" class="result-actions">
                <button class="btn-action btn-reset" onclick="backToTop()">戻る</button>
                <a id="shareLink" class="btn-action btn-share" target="_blank" href="#">Xで部屋を覗き見させる</a>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
