<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モノ申すおみくじ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- トップ画面 -->
        <div id="top-screen" class="screen">
            <header class="app-header">
                <h1 class="main-title">モノ申すおみくじ</h1>
                <p class="tagline">〜出かける前のあなたに、日用品からチクリと一言〜</p>
            </header>
            
            <div class="main-visual">
                <div class="character-group">
                    <div class="char-icon toaster">🍞<span>👁️👁️</span></div>
                    <div class="char-icon toothbrush">🪥<span>👁️👁️</span></div>
                    <div class="char-icon mug">☕<span>👁️👁️</span></div>
                </div>
            </div>

            <div class="action-area">
                <button id="draw-btn" class="primary-btn">おみくじを引く</button>
            </div>

            <div class="stats-footer">
                <p>解放されたモノたちの数: <span id="unlocked-count">3</span> / 6</p>
                <p class="points-display">継続ポイント: <span id="points-val">0</span> pt</p>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen hidden">
            <div class="result-header">
                <span class="result-label">本日の運勢（おもてなし度）</span>
                <h2 id="fortune-rank" class="rank-title">ーー</h2>
                <p id="fortune-subtitle" class="rank-subtitle">ーーー</p>
            </div>

            <div class="drama-box">
                <div class="drama-title">🏠 家の中の緊急脳内会議</div>
                <div id="drama-content" class="drama-lines">
                    <!-- JavaScriptで会話が挿入されます -->
                </div>
            </div>

            <div class="action-area">
                <button id="back-btn" class="secondary-btn">戻る（明日の朝また引く）</button>
            </div>
            
            <div id="unlock-notification" class="toast-notification hidden">
                <span class="toast-icon">✨</span>
                <span id="unlock-msg">新しいモノが会議に仲間入りしました！</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
